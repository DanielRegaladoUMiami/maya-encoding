[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maya-encoding"
dynamic = ["version"]
description = "Maya-inspired numerical encodings for machine learning: Vigesimal Feature Decomposition (VFD) and Maya Calendar Encoding (MCE)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Daniel Regalado", email = "dxr1491@miami.edu" },
]
keywords = [
    "machine-learning",
    "feature-engineering",
    "encoding",
    "maya",
    "vigesimal",
    "calendar",
    "time-series",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
benchmarks = ["xgboost>=1.5", "scipy>=1.7", "seaborn>=0.12", "pandas>=1.3"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas>=1.3",
    "matplotlib>=3.5",
]
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-material",
]
all = ["maya-encoding[viz,benchmarks,dev,docs]"]

[project.urls]
Homepage = "https://github.com/DanielRegaladoUMiami/maya-encoding"
Documentation = "https://DanielRegaladoUMiami.github.io/maya-encoding"
Repository = "https://github.com/DanielRegaladoUMiami/maya-encoding"
Issues = "https://github.com/DanielRegaladoUMiami/maya-encoding/issues"

[tool.hatch.version]
path = "src/maya_encoding/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/maya_encoding"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D104", "D203", "D213", "N803", "N806", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "N806"]
"benchmarks/*" = ["D100", "D101", "D102", "D103", "D104", "N806"]
"setup_github.sh" = ["D100"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
